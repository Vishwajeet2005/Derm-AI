services:
  - type: web
    name: dermai-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dermai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      # Make sure to add FIREBASE_CREDENTIALS_PATH or its JSON content directly in the Render Dashboard later
      - key: ALLOWED_ORIGINS
        value: https://your-vercel-frontend-url.vercel.app

databases:
  - name: dermai-db
    databaseName: dermai
    user: dermai
    plan: free
